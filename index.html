<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Futures Forum 2027</title>
<style>
:root{
  --ink:#241C2E; --muted:#5A5166; --violet:#57068C; --deep:#3B0560;
  --paper:#fff; --wash:#F4F0F7; --line:#DCD3E2; --stone:#B8A188;
  --gut:max(20px,(100% - 1100px)/2);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.app{display:flex;flex-direction:column;height:100%}

/* masthead */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px var(--gut);background:var(--violet);color:#fff;border-bottom:3px solid var(--stone)}
.bar h1{font:600 15px/1.2 var(--serif);margin:0;letter-spacing:.01em}
.rail{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.rail button{font:500 13px/1 var(--sans);color:#EBDDF5;background:none;border:0;
  padding:7px 9px;border-radius:4px;cursor:pointer}
.rail button:hover{background:rgba(255,255,255,.14);color:#fff}
.reg{font:600 13px/1 var(--sans);color:var(--deep);background:#fff;text-decoration:none;
  padding:9px 14px;border-radius:4px;white-space:nowrap}
.reg:hover{background:#F0E6F7}

/* scroll region */
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
section{padding:30px var(--gut);border-bottom:1px solid var(--line)}
section h2{font:600 22px/1.2 var(--serif);margin:0 0 14px}
p{margin:0 0 12px;max-width:68ch}
.lede{color:var(--muted)}

/* hero */
.hero{background:var(--wash);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero>h2,.hero>.tag,.hero>.when{position:relative;z-index:2}
.hero video,.scrim{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero video{object-fit:cover}
.scrim{z-index:1;background:linear-gradient(100deg,rgba(26,18,36,.93) 0%,rgba(26,18,36,.78) 52%,rgba(26,18,36,.55) 100%)}
.hero.film{background:#1A1224 center/cover no-repeat;color:#fff;border-bottom:0;
  min-height:clamp(250px,40vh,340px);display:flex;flex-direction:column;justify-content:center}
.hero.film .tag{color:#DCD1E8}
.hero.film .when b{color:#fff}
.hero.film .when span{color:#C4B4D4}
.hero h2{font:600 clamp(28px,5vw,42px)/1.1 var(--serif);letter-spacing:-.015em;margin:0 0 10px;max-width:16ch}
.tag{font-size:16px;color:var(--muted);max-width:52ch;margin:0 0 20px}
.when{display:flex;gap:26px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--stone)}
.when b{display:block;font:600 19px/1.25 var(--serif);color:var(--deep)}
.when span{font-size:13px;color:var(--muted)}

/* agenda */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs button{font:600 14px/1 var(--sans);color:var(--muted);background:none;border:0;
  padding:0 0 9px;margin-bottom:-1px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--deep);border-bottom-color:var(--stone)}
.slot{display:flex;gap:18px;padding:15px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.time{flex:0 0 74px;font:600 15px/1.35 var(--serif);color:var(--violet)}
.slot h3{font:600 15px/1.35 var(--sans);margin:0 0 3px}
.meta{font-size:13px;color:var(--muted);margin:0 0 5px}
.slot p{font-size:14px;color:var(--muted);margin:0}

/* speakers */
.people{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.who{border:1px solid var(--line);border-left:3px solid var(--violet);padding:14px}
.top{display:flex;gap:12px;align-items:flex-start}
.pic{flex:0 0 42px;height:42px;background:var(--violet);color:#fff;
  font:600 15px/42px var(--serif);text-align:center}
.who h3{font:600 15px/1.3 var(--sans);margin:0}
.who .meta{margin:2px 0 0}
.who button{font:500 13px/1 var(--sans);color:var(--deep);background:none;border:0;
  padding:9px 0 0;cursor:pointer;text-decoration:underline}
.bio{font-size:14px;color:var(--muted);margin:9px 0 0;display:none}
.who.open .bio{display:block}

/* venue */
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid h3{font:600 14px/1.3 var(--sans);margin:0 0 5px;color:var(--deep)}
.grid p{font-size:14px;color:var(--muted);margin:0}
.addr{font:400 15px/1.55 var(--serif);white-space:pre-line;padding-left:13px;border-left:2px solid var(--stone)}

/* faq */
.q{border-bottom:1px solid var(--line)}
.q button{display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;
  font:600 15px/1.4 var(--sans);color:var(--ink);background:none;border:0;padding:13px 0;cursor:pointer}
.q button::after{content:"+";font:400 19px/1 var(--sans);color:var(--violet)}
.q button[aria-expanded="true"]::after{content:"\2212"}
.q p{font-size:14px;color:var(--muted);margin:0 0 13px;max-width:70ch}
.q p[hidden]{display:none}

footer{padding:24px var(--gut) 34px;background:var(--wash);font-size:14px;color:var(--muted)}
footer a{color:var(--deep)}
footer p{margin:0 0 6px}
:focus-visible{outline:2px solid var(--stone);outline-offset:2px}
.bar :focus-visible{outline-color:#fff}
@media (max-width:420px){
  .rail{margin-left:0;order:3;width:100%}
  .time{flex-basis:62px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.hero video{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 id="mast"></h1>
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <a class="reg" id="reg" href="#" target="_blank" rel="noopener">Register</a>
  </header>
  <div class="scroll" id="scroll">
    <section class="hero" id="s-home">
      <h2 id="h-name"></h2>
      <p class="tag" id="h-tag"></p>
      <div class="when">
        <div><b id="h-dates"></b><span>Two days</span></div>
        <div><b id="h-venue"></b><span id="h-city"></span></div>
      </div>
    </section>
    <section id="s-about"><h2>About the forum</h2><div id="about"></div></section>
    <section id="s-agenda">
      <h2>Programme</h2>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="slots"></div>
    </section>
    <section id="s-speakers"><h2>Speakers</h2><div class="people" id="people"></div></section>
    <section id="s-venue">
      <h2>Venue and travel</h2>
      <p class="addr" id="addr"></p>
      <div class="grid" id="travel" style="margin-top:20px"></div>
    </section>
    <section id="s-faq" style="border-bottom:0"><h2>Questions</h2><div id="faq"></div></section>
    <footer>
      <p id="f-host"></p>
      <p>Email <a id="f-mail" href="#"></a> with anything the programme does not answer.</p>
      <p id="f-social"></p>
    </footer>
  </div>
</div>

<script>
/* ==========================================================================
   1. CONFERENCE  — the basics. Edit these first.
   ========================================================================== */
const CONF = {
  name:    "Digital Futures Forum 2027",
  short:   "Digital Futures Forum",
  tagline: "Two days on how universities build, govern and sustain digital systems that outlast the people who launch them.",
  dates:   "12–13 March 2027",
  venue:   "Conference Center",
  city:    "NYU Abu Dhabi, Saadiyat Island",
  host:    "Hosted by the Office of External Relations and Communications, NYU Abu Dhabi.",
  register:"https://example.com/register",   // <- your form or ticketing link
  email:   "digitalfutures@example.edu",
  social:  [ {label:"LinkedIn", url:"https://linkedin.com"},
             {label:"Programme PDF", url:"https://example.com/programme.pdf"} ]
};

/* ==========================================================================
   1b. HERO VIDEO
   Leave `video` as "" to go back to the plain tinted hero.
   Files live in a /media folder in this same repository.
   ========================================================================== */
const HERO = {
  video:  "media/hero.mp4",   // required for the video hero
  webm:   "",                 // optional smaller alternative, e.g. "media/hero.webm"
  poster: "media/hero.jpg"    // still frame: shows before load and for reduced motion
};

/* ==========================================================================
   2. ABOUT — one string per paragraph.
   ========================================================================== */
const ABOUT = [
  "Most institutional technology is inherited rather than chosen. A platform is bought for one campaign, absorbed into daily work, and ten years later nobody remembers the decision or can afford to undo it. This forum is about that long middle period — the governance, the integrations, the quiet maintenance that determines whether a system serves the institution or the other way round.",
  "Sessions are deliberately practical. Speakers bring a live problem and what it cost them, not a product roadmap. Expect frank accounting of migrations that overran, security reviews that reshaped a rollout, and automation that removed work rather than relocating it.",
  "Attendance is capped at 120 so the discussion stays specific. Registration closes once the room is full."
];

/* ==========================================================================
   3. AGENDA — one object per day, sessions in order.
   ========================================================================== */
const AGENDA = [
  { day:"Day one — 12 March", sessions:[
    { time:"09:00", title:"Registration and coffee", speaker:"", room:"Atrium", desc:"Badges, wifi codes and the printed programme." },
    { time:"09:45", title:"Opening: the systems we did not choose", speaker:"Dr Amira Haddad", room:"Auditorium", desc:"How institutional platforms accumulate, and what it takes to regain a decision." },
    { time:"11:15", title:"Governing integrations across a federated campus", speaker:"Marcus Vaughn", room:"Room A2", desc:"A working model for deciding which systems may talk to which, and who signs off." },
    { time:"13:30", title:"Workshop: mapping your own dependency graph", speaker:"Priya Raman", room:"Studio B", desc:"Bring a laptop. You will leave with a first-pass map of your own stack and its single points of failure." },
    { time:"16:00", title:"Panel: buying, building, and the ground in between", speaker:"All speakers", room:"Auditorium", desc:"Open floor. Questions may be submitted anonymously at the desk." }
  ]},
  { day:"Day two — 13 March", sessions:[
    { time:"09:30", title:"Security review as a design constraint", speaker:"Marcus Vaughn", room:"Auditorium", desc:"Treating compliance as an input to architecture instead of a gate at the end." },
    { time:"11:00", title:"Automation that removes work", speaker:"Priya Raman", room:"Room A2", desc:"Three automations that stuck, two that were quietly abandoned, and what separated them." },
    { time:"13:15", title:"Event technology under real conditions", speaker:"Lina Osei", room:"Studio B", desc:"Registration, check-in and livestream for a 2,000-person event, including what failed on the day." },
    { time:"15:30", title:"Closing remarks and next year", speaker:"Dr Amira Haddad", room:"Auditorium", desc:"Commitments from the room, and the call for proposals for 2028." }
  ]}
];

/* ==========================================================================
   4. SPEAKERS — initials are generated from the name.
   ========================================================================== */
const SPEAKERS = [
  { name:"Dr Amira Haddad", title:"Vice Provost for Digital Strategy", org:"Gulf Institute of Technology",
    bio:"Leads institutional technology strategy across three campuses. Her work on platform lifecycle governance is used as a reference model by several regional universities. Previously ran enterprise architecture in the airline sector." },
  { name:"Marcus Vaughn", title:"Director of Information Security", org:"Northbridge University",
    bio:"Spent a decade in financial services before moving into higher education. Writes and speaks about making security review a collaborative design step rather than an approval bottleneck." },
  { name:"Priya Raman", title:"Head of Automation and Integration", org:"Meridian Health Systems",
    bio:"Builds integration layers for organisations with large legacy estates. Known for an unusually honest public record of which of her automation projects were later switched off, and why." },
  { name:"Lina Osei", title:"Senior Manager, Event Technology", org:"Continental Events Group",
    bio:"Runs registration, check-in and broadcast operations for conferences and ceremonies across the region. Has delivered more than 200 events and keeps a detailed failure log from every one." }
];

/* ==========================================================================
   5. VENUE — address uses line breaks; blocks are free text.
   ========================================================================== */
const VENUE = {
  address:"Conference Center, Campus Building A6\nNYU Abu Dhabi, Saadiyat Island\nAbu Dhabi, United Arab Emirates",
  blocks:[
    { h:"Getting there", p:"About 30 minutes by car from Abu Dhabi International Airport and 20 minutes from the city centre. Taxis and ride-hailing drop at the A6 entrance. A shuttle runs from the two partner hotels each morning." },
    { h:"Parking", p:"Visitor parking is in P2, directly under the Conference Center. Register your plate at the desk on arrival to avoid a ticket." },
    { h:"Staying nearby", p:"Rooms are held at the Saadiyat Rotana and the Jumeirah Saadiyat until 1 February under the forum's name. Both are a short shuttle ride from campus." }
  ]
};

/* ==========================================================================
   6. FAQ
   ========================================================================== */
const FAQ = [
  { q:"Is there a fee?", a:"No. The forum is funded by the host institution. Travel and accommodation are your own." },
  { q:"Can I attend one day only?", a:"Yes. Indicate which day on the registration form so catering numbers are right." },
  { q:"Will sessions be recorded?", a:"Keynotes and panels are recorded and posted within two weeks. Workshops are not recorded, so the discussion stays candid." },
  { q:"What is the dress code?", a:"Business casual. The rooms are cool, so bring a layer." },
  { q:"I need dietary or access accommodations.", a:"There is a field on the registration form. Anything submitted at least ten days ahead can be arranged." }
];

/* ==========================================================================
   Rendering — you should not need to edit below this line.
   ========================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$("mast").textContent  = CONF.short;
$("h-name").textContent = CONF.name;
$("h-tag").textContent  = CONF.tagline;
$("h-dates").textContent = CONF.dates;
$("h-venue").textContent = CONF.venue;
$("h-city").textContent  = CONF.city;
$("reg").href = CONF.register;
$("f-host").textContent = CONF.host;
$("f-mail").href = "mailto:" + CONF.email;
$("f-mail").textContent = CONF.email;
$("f-social").innerHTML = CONF.social
  .map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(" &nbsp; ");

if (HERO.video) {
  const h = $("s-home");
  h.classList.add("film");
  if (HERO.poster) h.style.backgroundImage = `url("${HERO.poster}")`;
  h.insertAdjacentHTML("afterbegin",
    `<video autoplay muted loop playsinline preload="metadata"` +
    (HERO.poster ? ` poster="${esc(HERO.poster)}"` : ``) +
    ` aria-hidden="true" tabindex="-1">` +
    (HERO.webm ? `<source src="${esc(HERO.webm)}" type="video/webm">` : ``) +
    `<source src="${esc(HERO.video)}" type="video/mp4"></video><div class="scrim"></div>`);
}

$("about").innerHTML = ABOUT.map(p => `<p class="lede">${esc(p)}</p>`).join("");

const NAV = [["s-about","About"],["s-agenda","Programme"],["s-speakers","Speakers"],["s-venue","Venue"],["s-faq","Questions"]];
$("rail").innerHTML = NAV.map(([id,l]) => `<button type="button" data-go="${id}">${l}</button>`).join("");
$("rail").addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) $(b.dataset.go).scrollIntoView({behavior:"smooth", block:"start"});
});

let day = 0;
function drawAgenda(){
  $("tabs").innerHTML = AGENDA.map((d,i) =>
    `<button type="button" role="tab" aria-selected="${i===day}" data-day="${i}">${esc(d.day)}</button>`).join("");
  $("slots").innerHTML = AGENDA[day].sessions.map(s => `
    <div class="slot">
      <div class="time">${esc(s.time)}</div>
      <div>
        <h3>${esc(s.title)}</h3>
        <p class="meta">${[s.speaker, s.room].filter(Boolean).map(esc).join(" &mdash; ")}</p>
        <p>${esc(s.desc)}</p>
      </div>
    </div>`).join("");
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-day]");
  if (b) { day = +b.dataset.day; drawAgenda(); }
});
drawAgenda();

$("people").innerHTML = SPEAKERS.map((s,i) => {
  const ini = s.name.replace(/^Dr\s+/i,"").split(/\s+/).slice(0,2).map(w => w[0]).join("");
  return `<article class="who" id="w${i}">
    <div class="top">
      <div class="pic" role="img" aria-label="Portrait placeholder for ${esc(s.name)}">${esc(ini)}</div>
      <div><h3>${esc(s.name)}</h3><p class="meta">${esc(s.title)}, ${esc(s.org)}</p></div>
    </div>
    <button type="button" aria-expanded="false" aria-controls="b${i}" data-bio="${i}">Read bio</button>
    <p class="bio" id="b${i}">${esc(s.bio)}</p>
  </article>`;
}).join("");
$("people").addEventListener("click", e => {
  const b = e.target.closest("[data-bio]");
  if (!b) return;
  const card = $("w" + b.dataset.bio), open = card.classList.toggle("open");
  b.setAttribute("aria-expanded", open);
  b.textContent = open ? "Hide bio" : "Read bio";
});

$("addr").textContent = VENUE.address;
$("travel").innerHTML = VENUE.blocks.map(b => `<div><h3>${esc(b.h)}</h3><p>${esc(b.p)}</p></div>`).join("");

$("faq").innerHTML = FAQ.map((f,i) => `
  <div class="q">
    <button type="button" aria-expanded="false" aria-controls="a${i}">${esc(f.q)}</button>
    <p id="a${i}" hidden>${esc(f.a)}</p>
  </div>`).join("");
$("faq").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", !open);
  b.nextElementSibling.hidden = open;
});
</script>
</body>
</html>
